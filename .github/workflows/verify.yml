name: verify

# 六层质量门：功能回归（v6 串行接口 + v7 AXI4-Lite）
# + 测试向量独立核对 + 两代静态 lint + 驱动级三方对照（C 驱动 -> 真 RTL -> hashlib）
# 每条门都以"外人能一条命令证伪"为标准设计。
# 每次 push / PR 都跑。
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  simulate:
    # 24.04 的 apt verilator 是 5.x，与本地开发用的 5.018 同代；
    # 22.04 只有 4.x，它不认识 `lint_off UNUSEDSIGNAL` 这个规则名，
    # 会把 v7 里已显式屏蔽的两位地址告警重新报出来。
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Icarus Verilog 与 Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator gcc

      - name: 校验测试向量（独立于 RTL，用 Python hashlib 计算）
        run: python3 scripts/check_vectors.py

      - name: 跑 v6 功能回归（三条锚点向量，串行接口）
        run: bash scripts/verify.sh

      - name: 跑 v7 功能回归（AXI4-Lite + 多块流式）
        run: bash scripts/verify_v7.sh

      - name: 静态 Lint v6（verilator，位宽扩展告警已按版本豁免）
        run: bash scripts/lint_check.sh

      - name: 静态 Lint v7（verilator，要求零告警）
        run: bash scripts/lint_v7.sh

      - name: 驱动级三方对照（C 驱动生成的寄存器序列 -> 真 RTL -> hashlib）
        run: bash scripts/verify_driver.sh

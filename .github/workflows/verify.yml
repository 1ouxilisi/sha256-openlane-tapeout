name: verify

# 四层质量门：功能回归（RTL 仿真）+ 测试向量独立核对（Python hashlib）
# + 静态 lint（verilator）。每次 push / PR 都跑。
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Icarus Verilog 与 Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator

      - name: 校验测试向量（独立于 RTL，用 Python hashlib 计算）
        run: python3 scripts/check_vectors.py

      - name: 跑 RTL 功能回归（三条锚点向量）
        run: bash scripts/verify.sh

      - name: 静态 Lint（verilator，位宽扩展告警已按版本豁免）
        run: bash scripts/lint_check.sh
